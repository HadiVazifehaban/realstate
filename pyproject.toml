[project]
name = "avg-crm-mls"
version = "2.0.0"
description = "AVG CRM & MLS Core - Hybrid Edge/Cloud Real-Estate Platform (Phase 2: Scraper Hybrid)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AVG - گروه چشم‌انداز اوج فردا", email = "dev@avgcrm.com" }]
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0.30",
    "geoalchemy2>=0.15",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "cryptography>=43.0",
    "psycopg[binary]>=3.2",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "curl-cffi>=0.10",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "redis>=5.0",
    "pyjwt>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
avg-license = "app.cli.license_tool:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]